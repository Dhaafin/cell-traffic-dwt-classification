<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dwt-pipeline-title dwt-pipeline-desc" id="dwt-optimization-pipeline-root">
        <title id="dwt-pipeline-title">2D-DWT Cellular Traffic Classification Pipeline</title>
        <desc id="dwt-pipeline-desc">Architecture pipeline transforming 7x24 cellular throughput matrices via 2D Haar wavelet decomposition and physical statistics into a tuned Random Forest achieving 88.16% accuracy.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dwt-optimization-pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dwt-optimization-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dwt-optimization-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #dwt-optimization-pipeline-root .subtitle { font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem; }
      #dwt-optimization-pipeline-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="dwt-optimization-pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="dwt-optimization-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="dwt-optimization-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="dwt-optimization-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Background: Warm Paper + Subtle Dot Grid -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dwt-optimization-pipeline-dots)" opacity="0.55"/>

        <!-- =================================================================
             ZONES (Drawn before arrows and nodes)
             ================================================================= -->
        <!-- Zone 1: Stage 1 Feature Engineering (50%) -->
        <rect x="248" y="88" width="472" height="344" rx="8"
              fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="264" y="92" width="236" height="12" rx="2" fill="#f5f5f5"/>
        <text x="382" y="101" fill="#4f5d75" font-size="7.5" font-weight="500"
              font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1 · ORTHOGONAL FEATURE SYNERGY (50%)</text>

        <!-- Zone 2: Stage 2 Hyperparameter Tuning & Validation (50%) -->
        <rect x="768" y="88" width="272" height="344" rx="8"
              fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="780" y="92" width="188" height="12" rx="2" fill="#f5f5f5"/>
        <text x="874" y="101" fill="#4f5d75" font-size="7.5" font-weight="500"
              font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 2 · CAPACITY TUNING (50%)</text>

        <!-- =================================================================
             ARROWS (Drawn before boxes, strict orthogonal r=8 bends)
             ================================================================= -->
        <!-- Node 1 (Input) -> Node 2 (2D-DWT Haar) -->
        <path d="M 192,244 H 224 Q 232,244 232,236 V 188 Q 232,180 240,180 H 272"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dwt-optimization-pipeline-arrow)"/>

        <!-- Node 1 (Input) -> Node 3 (Physical Time Stats) -->
        <path d="M 192,276 H 224 Q 232,276 232,284 V 332 Q 232,340 240,340 H 272"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dwt-optimization-pipeline-arrow)"/>

        <!-- Node 2 (2D-DWT Haar) -> Node 4 (9-Feature Vector) -->
        <path d="M 456,180 H 480 Q 488,180 488,188 V 236 Q 488,244 496,244 H 516"
              fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#dwt-optimization-pipeline-arrow-accent)"/>

        <!-- Node 3 (Physical Time Stats) -> Node 4 (9-Feature Vector) -->
        <path d="M 456,340 H 480 Q 488,340 488,332 V 284 Q 488,276 496,276 H 516"
              fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#dwt-optimization-pipeline-arrow-accent)"/>

        <!-- Node 4 (9-Feature Vector) -> Node 5 (Tuned Random Forest) -->
        <path d="M 696,260 H 736 Q 744,260 744,252 V 192 Q 744,184 752,184 H 796"
              fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#dwt-optimization-pipeline-arrow-accent)"/>

        <!-- Node 5 (Tuned Random Forest) -> Node 6 (4-Class Profile Output) -->
        <line x1="904" y1="232" x2="904" y2="296"
              stroke="#eb6c36" stroke-width="1.4" marker-end="url(#dwt-optimization-pipeline-arrow-accent)"/>

        <!-- =================================================================
             ARROW LABELS (6-10px visible gap from stroke, opaque paper mask)
             ================================================================= -->
        <!-- Label beside vertical segment x=904 (between y=232 and y=296) -->
        <rect x="912" y="256" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="946" y="265" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">5-FOLD CV</text>

        <!-- =================================================================
             NODES (Opaque mask rect first, then styled box)
             ================================================================= -->

        <!-- Node 1: 7x24 Traffic Matrix (Input) -->
        <rect x="40" y="216" width="152" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="216" width="152" height="88" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="224" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.45" stroke-width="0.8"/>
        <text x="64" y="233" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RAW</text>
        <text x="116" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7×24 Traffic Matrix</text>
        <text x="116" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">7d × 24h (168h)</text>
        <text x="116" y="290" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">1,140 balanced samples</text>

        <!-- Node 2: 2D-DWT Haar Decomposition (Backend/Transform) -->
        <rect x="272" y="136" width="184" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="136" width="184" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="446" y="156" fill="#2d3142" fill-opacity="0.12" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
        <rect x="280" y="144" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="296" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FREQ</text>
        <text x="364" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2D-DWT Haar (L1)</text>
        <text x="364" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 Directional Energies</text>
        <text x="364" y="206" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">E_LL · E_LH · E_HL · E_HH</text>

        <!-- Node 3: Physical Time Stats (Store/Domain) -->
        <rect x="272" y="296" width="184" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="296" width="184" height="88" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="446" y="316" fill="#2d3142" fill-opacity="0.12" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
        <rect x="280" y="304" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="296" y="313" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIME</text>
        <text x="364" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Physical Time Stats</text>
        <text x="364" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 Magnitude Markers</text>
        <text x="364" y="366" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Mean · Med · Std · Max · Min</text>

        <!-- Node 4: 9-Feature Hybrid Vector (Focal 1 - Coral) -->
        <rect x="516" y="216" width="180" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="516" y="216" width="180" height="88" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="686" y="236" fill="#eb6c36" fill-opacity="0.22" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">9F</text>
        <rect x="524" y="224" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="542" y="233" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FUSED</text>
        <text x="606" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">9-Feature Synergy</text>
        <text x="606" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 Haar + 5 Temporal</text>
        <text x="606" y="288" fill="#eb6c36" font-size="8.5" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">Untuned RF: 87.28%</text>

        <!-- Node 5: Tuned Random Forest (Focal 2 - Coral) -->
        <rect x="796" y="136" width="216" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="796" y="136" width="216" height="96" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="1002" y="156" fill="#eb6c36" fill-opacity="0.22" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">88%</text>
        <rect x="804" y="144" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="822" y="153" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
        <text x="904" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tuned Random Forest</text>
        <text x="904" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">n=300 · max_depth=8</text>
        <text x="904" y="210" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">Peak: 88.16% (+8.77%)</text>

        <!-- Node 6: 4-Class Traffic Profile Output (Backend) -->
        <rect x="796" y="296" width="216" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="796" y="296" width="216" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="804" y="304" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="820" y="313" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVAL</text>
        <text x="904" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4-Class Traffic Profile</text>
        <text x="904" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UU · UD · CU · CD (86.93% ± 1.16%)</text>
        <text x="904" y="370" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">SVM 87.7% · XGB 86.8% · KNN 85.1%</text>

        <!-- =================================================================
             EDITORIAL CALLOUTS (Instrument Serif Italic, Top Margin, Max 2)
             ================================================================= -->
        <!-- Callout 1: Parsimony Principle -->
        <text x="516" y="48" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', serif" text-anchor="middle">9 features beat 16 noisy subband moments (87.28% vs 85.09%)</text>
        <path d="M 588,56 Q 604,124 604,212" fill="none"
              stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="604" cy="212" r="2.5" fill="#2d3142"/>

        <!-- Callout 2: Structural Tree Pruning -->
        <text x="904" y="48" fill="#eb6c36" font-size="14" font-style="italic"
              font-family="'Instrument Serif', serif" text-anchor="middle">Tree pruning at depth=8 prevents memorizing burst noise</text>
        <path d="M 988,56 Q 996,92 984,132" fill="none"
              stroke="#eb6c36" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="984" cy="132" r="2.5" fill="#eb6c36"/>

        <!-- =================================================================
             LEGEND STRIP (Horizontal bottom strip outside all zones)
             ================================================================= -->
        <line x1="40" y1="476" x2="1040" y2="476" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="40" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>

        <!-- Item 1: Focal / Winning Path -->
        <rect x="40" y="512" width="16" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="64" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal optimization (9-Feature &amp; Tuned RF)</text>

        <!-- Item 2: Transform / Output -->
        <rect x="296" y="512" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Transform / Evaluation</text>

        <!-- Item 3: Statistical Store -->
        <rect x="476" y="512" width="16" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="500" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Time-domain statistics</text>

        <!-- Item 4: Raw Input -->
        <rect x="656" y="512" width="16" height="12" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <text x="680" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Raw 7×24 matrix input</text>

        <!-- Item 5: Primary Winning Flow -->
        <line x1="836" y1="518" x2="864" y2="518" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#dwt-optimization-pipeline-arrow-accent)"/>
        <text x="872" y="521" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Winning feature &amp; model path</text>
      </svg>
